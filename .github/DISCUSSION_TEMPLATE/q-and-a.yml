title: "[问答] "
labels:
  - "type:support"
body:
  - type: markdown
    attributes:
      value: |
        请只提供解决问题所需的最少信息，不要发布私人文本、token、完整路径或未脱敏截图。
  - type: textarea
    id: question
    attributes:
      label: 你的问题
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Pointrans 与 macOS 版本
      placeholder: 例如 Pointrans 1.0.0 / macOS 15.1
  - type: textarea
    id: tried
    attributes:
      label: 已经尝试过什么

