name: Bug Report
description: 报告可以稳定复现的产品问题
title: "[Bug] "
labels:
  - "type:bug"
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。Issue 是公开的，请删除私人文本、账号、token、完整路径和无关截图。安全漏洞请不要在这里提交。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题
          required: true
        - label: 我没有附上私人文字、凭据或未脱敏的数据
          required: true
        - label: 这不是安全漏洞或疑似数据泄露
          required: true
  - type: input
    id: app-version
    attributes:
      label: Pointrans 版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 15.1
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac 芯片
      options:
        - Apple Silicon
        - Intel
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用演示文字，不要粘贴私人内容。
      placeholder: |
        1. 打开……
        2. 按住……
        3. 将光标停在……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: dropdown
    id: accessibility
    attributes:
      label: 辅助功能权限
      options:
        - 已授权
        - 未授权
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: screen-recording
    attributes:
      label: 屏幕录制权限
      options:
        - 已授权
        - 未授权
        - 不确定
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 其他必要信息
      description: 只附上经过裁剪和遮挡的最少信息。

