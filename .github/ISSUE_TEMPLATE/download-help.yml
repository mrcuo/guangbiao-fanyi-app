name: Download Help
description: 报告官方下载、校验或安装问题
title: "[下载与安装] "
labels:
  - "type:support"
  - "area:update"
body:
  - type: markdown
    attributes:
      value: |
        如果校验值或签名验证失败，请停止安装。我们不会要求你关闭 Gatekeeper、修改系统安全策略或运行来源不明的命令。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 文件来自 README 列出的官方入口
          required: true
        - label: 我已删除截图中的账号、完整路径和个人信息
          required: true
        - label: 我不会把安装包上传到公开 Issue
          required: true
  - type: input
    id: source
    attributes:
      label: 下载入口
      description: 只填写官方页面地址，不粘贴含个人参数的链接。
    validations:
      required: true
  - type: input
    id: filename
    attributes:
      label: 文件名
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: macOS 版本和芯片
      placeholder: 例如 macOS 15.1 / Apple Silicon
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: 系统提示或失败现象
      description: 可以粘贴简短提示文字；不要上传完整诊断日志。
    validations:
      required: true
  - type: input
    id: checksum
    attributes:
      label: SHA-256 校验结果
      description: 尚未执行时填写“未执行”。
    validations:
      required: true

